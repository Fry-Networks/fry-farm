version: '3.8'
services:
  backend:
    build: ./backend
    image: fry-farm-backend:latest
    container_name: fry-farm-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_WALLETS=${ADMIN_WALLETS}
      - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN}
      - REWARD_MNEMONIC=${REWARD_MNEMONIC}
      - REWARD_REKEY=${REWARD_REKEY}
      - VOI_REWARD_MNEMONIC=${VOI_REWARD_MNEMONIC}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - DISCORD_BUG_WEBHOOK_URL=${DISCORD_BUG_WEBHOOK_URL}
      - DISCORD_BUG_REPORT_WEBHOOK_URL=${DISCORD_BUG_REPORT_WEBHOOK_URL}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-https://fry.farm/api/discord/callback}
      - ATLAS00_ALGOD_TOKEN=${ATLAS00_ALGOD_TOKEN}
      - ATLAS00_VOI_ALGOD_TOKEN=${ATLAS00_VOI_ALGOD_TOKEN}
      - ALPHA_ARCADE_API_KEY=${ALPHA_ARCADE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_ALLOWED_USER_ID=${GITHUB_ALLOWED_USER_ID}
      - GITHUB_COOKIE_SECRET=${GITHUB_COOKIE_SECRET}
      - EVENT_CALLER_MASTER_KEY=${EVENT_CALLER_MASTER_KEY}
      - REDIS_HOST=172.18.0.1
      - FEE_ENFORCEMENT_GRACE_UNTIL=2026-03-21T00:00:00Z
    volumes:
      - /etc/ssl/mongo/mongo-ca.crt:/etc/ssl/mongo/mongo-ca.crt:ro
      - /opt/fry-farm/backend/uploads:/app/uploads
    dns:
      - 100.100.100.100
      - 8.8.8.8
      - 1.1.1.1
    command: ["node", "index.js"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
